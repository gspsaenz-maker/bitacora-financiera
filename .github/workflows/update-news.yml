name: Actualizar Bitácora Financiera

on:
  schedule:
    # 06:00 América/Guatemala (UTC-6) = 12:00 UTC. Ajusta si cambias de zona.
    - cron: "0 12 * * *"
  workflow_dispatch: {}  # permite correrlo manualmente desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: bitacora-financiera-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Jalar noticias
        run: python scripts/fetch_news.py

      - name: Publicar cambios
        run: |
          git config user.name "bitacora-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data/news.json
          git diff --quiet --cached || git commit -m "Actualización automática de noticias $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
